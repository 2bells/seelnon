<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pixel GIA</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="app">
    <header class="titlebar">
      <div class="brand">
        <span class="logo">P</span>
        <span class="brand-name">Pixel GIA</span>
      </div>
      <div class="titlebar-right">
        <span class="doc-name">untitled-64.gia</span>
        <span class="zoom" id="zoom">100%</span>
      </div>
    </header>

    <div class="workspace">
      <aside class="toolbar">
        <button class="tool" id="import" title="Import image">&#128444;</button>
        <button class="tool" id="erase" title="Eraser">&#9633;</button>
        <button class="tool" id="clear" title="Clear">&#10005;</button>
        <input type="file" id="file" accept="image/*" hidden />
      </aside>

      <section class="canvas-area">
        <div class="canvas-frame">
          <canvas id="grid"></canvas>
        </div>
        <div class="palette" id="palette">
          <input type="color" id="wheel" value="#444444" title="color wheel" class="wheel" />
        </div>
      </section>

      <aside class="panel">
        <div class="panel-head">
          <span>Layers</span>
          <span class="grid-ctl">
            grid
            <select id="size">
              <option value="16">16×16</option>
              <option value="20">20×20</option>
              <option value="24">24×24</option>
              <option value="28">28×28</option>
              <option value="30">30×30</option>
              <option value="32">32×32</option>
              <option value="64" selected>64×64</option>
              <option value="128">128×128</option>
            </select>
          </span>
        </div>
        <div class="tabs" id="tabs"></div>

        <div class="panel-head">
          <span>Export</span>
        </div>
        <div class="export">
          <label class="row">
            <span>font size</span>
            <select id="font">
              <option value="auto" selected>auto (fit box)</option>
              <option value="none">none (omit)</option>
              <option value="8">8</option>
              <option value="10">10</option>
              <option value="12">12</option>
              <option value="16">16</option>
              <option value="20">20</option>
              <option value="24">24</option>
              <option value="32">32</option>
            </select>
          </label>
          <label class="row">
            <span>box size</span>
            <span class="box">
              <input id="boxw" type="number" value="1200" min="1" />
              <span class="x">×</span>
              <input id="boxh" type="number" value="1500" min="1" />
            </span>
          </label>
          <label class="row">
            <span>name</span>
            <input id="name" type="text" value="ASCII_Template" spellcheck="false" />
          </label>
          <label class="row">
            <span>zoom x</span>
            <input id="zoomx" type="number" value="1" step="0.05" min="0.1" />
          </label>
          <label class="row">
            <span>zoom y</span>
            <input id="zoomy" type="number" value="0.8" step="0.05" min="0.1" />
          </label>
          <label class="row">
            <span>max colors</span>
            <input id="maxcolors" type="number" value="7" min="1" max="64" />
          </label>
          <label class="row">
            <span>blank</span>
            <select id="blank">
              <option value="space">space</option>
              <option value="full" selected>full-width</option>
              <option value="block">bg block</option>
            </select>
          </label>
          <label class="row" id="bgwrap" hidden>
            <span>bg</span>
            <input id="bg" type="color" value="#000000" />
          </label>
          <label class="row">
            <span>limit</span>
            <input id="limit" type="number" value="1000" min="1" />
          </label>
        </div>

        <label class="field">
          <span class="lbl">ASCII <em>(one text box per color tab — no color tags)</em></span>
          <div class="tabbody">
            <textarea id="out" rows="9" readonly spellcheck="false"></textarea>
            <button class="tool" id="copy">copy</button>
          </div>
        </label>

        <div class="meter">
          <span id="len"></span>
          <span id="fit"></span>
        </div>

        <div class="controls">
          <button class="go" id="go">Build .gia</button>
          <a class="dl" id="dl" download="pixel.gia" hidden>download .gia</a>
        </div>
        <div class="status" id="status"></div>
      </aside>
    </div>
  </div>
  <script type="module" src="./app.js"></script>
</body>
</html>
