<div class="gematria-container">
    <div class="gematria-header">HEBREW MATRIX CALCULATOR</div>
    <div class="input-row">
        <input type="text" id="hebrewInput" placeholder="Paste Hebrew text here... (e.g., הטבע אוֹר)" oninput="processText()">
    </div>
    <div id="gematriaOutput" class="output-display"></div>
    <div id="sentenceSummary" class="sentence-summary" style="display: none;"></div>
</div>

<style>
/* Clean, low-contrast dark terminal styling */
.gematria-container {
    background: #0d0d0d;
    border: 1px solid #1c1814;
    border-radius: 6px;
    padding: 16px;
    font-family: monospace;
    max-width: 600px;
    margin: 10px auto;
}
.gematria-header {
    color: #55483b;
    font-size: 0.8rem;
    letter-spacing: 2px;
    margin-bottom: 12px;
    border-bottom: 1px solid #1c1814;
    padding-bottom: 4px;
}
.input-row input {
    width: 100%;
    background: #110f0d;
    border: 1px solid #241f1a;
    color: #d1c4b6;
    padding: 10px;
    font-size: 1.1rem;
    font-family: monospace;
    border-radius: 4px;
    box-sizing: border-box;
    outline: none;
}
.input-row input:focus {
    border-color: #a38665;
}
.output-display {
    margin-top: 14px;
}
.word-block {
    background: #111;
    border-left: 3px solid #a38665;
    padding: 10px;
    margin-bottom: 8px;
    border-radius: 0 4px 4px 0;
}
.word-meta-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 4px;
}
.word-translation {
    color: #8f7e6b;
    font-size: 0.85rem;
    font-style: italic;
}
.word-text-group {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
}
.word-title {
    font-size: 1.2rem;
    color: #e0e0e0;
    direction: rtl;
    text-align: right;
}
.word-phonetic {
    font-size: 0.75rem;
    color: #7a6a58;
    margin-top: 1px;
}
.word-math {
    color: #6e5e4f;
    font-size: 0.9rem;
}
.word-total {
    color: #a38665;
    font-weight: bold;
    font-size: 1.1rem;
    margin-top: 4px;
}
.sentence-summary {
    margin-top: 16px;
    padding: 12px;
    background: #141210;
    border: 1px dashed #3a3128;
    border-radius: 4px;
    color: #d1c4b6;
    font-size: 1rem;
    font-weight: bold;
    text-align: center;
}
</style>

<script>
// Complete dictionary matching characters to values and names
const letterData = {
    'א': { name: 'Aleph', val: 1 },   'ב': { name: 'Bet', val: 2 }, 
    'ג': { name: 'Gimel', val: 3 },  'ד': { name: 'Dalet', val: 4 }, 
    'ה': { name: 'Hey', val: 5 },    'ו': { name: 'Vav', val: 6 }, 
    'ז': { name: 'Zayin', val: 7 },  'ח': { name: 'Chet', val: 8 }, 
    'ט': { name: 'Tet', val: 9 },    'י': { name: 'Yod', val: 10 },
    'כ': { name: 'Kaf', val: 20 },   'ל': { name: 'Lamed', val: 30 }, 
    'מ': { name: 'Mem', val: 40 },   'נ': { name: 'Nun', val: 50 }, 
    'ס': { name: 'Samekh', val: 60 },'ע': { name: 'Ayin', val: 70 }, 
    'פ': { name: 'Pe', val: 80 },    'צ': { name: 'Tsadi', val: 90 }, 
    'ק': { name: 'Kof', val: 100 },  'ר': { name: 'Resh', val: 200 }, 
    'ש': { name: 'Shin', val: 300 }, 'ת': { name: 'Tav', val: 400 },
    'ך': { name: 'Kaf (Final)', val: 20 }, 
    'ם': { name: 'Mem (Final)', val: 40 }, 
    'ן': { name: 'Nun (Final)', val: 50 }, 
    'ף': { name: 'Pe (Final)', val: 80 }, 
    'ץ': { name: 'Tsadi (Final)', val: 90 }
};

// Local lookup index holding both translation data and phonetics profiles
const translationCache = {
    'אלהים': { eng: 'God', phn: '’ĕ·lō·hîm' },
    'ויאמר': { eng: 'And said', phn: 'way·yō·mer' },
    'יהי': { eng: 'Let there be', phn: 'yə·hî' },
    'רקיע': { eng: 'A firmament', phn: 'rā·qî··a‘' },
    'ברקיע': { eng: 'In the firmament', phn: 'bi·rə·qî·a‘' },
    'הרקיע': { eng: 'The firmament', phn: 'hā·rā·qî·a‘' },
    'לרקיע': { eng: 'The firmament (to/for)', phn: 'lā·rā·qî·a‘' },
    'בתוך': { eng: 'In the midst / between', phn: 'bə·ṯō·wḵ' },
    'המים': { eng: 'The waters', phn: 'ham·mā·yim' },
    'למים': { eng: '[and] waters / to the waters', phn: 'lā·mā·yim' },
    'מים': { eng: 'Waters', phn: 'mā·yim' },
    'ויהי': { eng: 'And let it be / and it was', phn: 'wî·hî' },
    'מבדיil': { eng: 'Dividing / separating', phn: 'mab·dîl' }, // standard dynamic layout handling
    'מבדיל': { eng: 'Dividing / separating', phn: 'mab·dîl' },
    'ויבדל': { eng: 'And He divided', phn: 'way·yab·dêl' },
    'בין': { eng: 'Between', phn: 'bên' },
    'ובין': { eng: 'And between', phn: 'ū·ḇên' },
    'ויעש': { eng: 'And made', phn: 'way·ya·‘aś' },
    'אשר': { eng: 'That [were] / which', phn: '’ă·šer' },
    'מתחת': { eng: 'Under / beneath', phn: 'mit·ta·ḥaṯ' },
    'מעל': { eng: 'Above', phn: 'mê·‘al' },
    'השמים': { eng: 'The heavens / sky', phn: 'haš·šā·ma·yim' }
};

async function processText() {
    const input = document.getElementById('hebrewInput').value;
    const outputDiv = document.getElementById('gematriaOutput');
    const summaryDiv = document.getElementById('sentenceSummary');
    
    outputDiv.innerHTML = ''; 
    summaryDiv.innerHTML = '';
    summaryDiv.style.display = 'none';
    
    if (!input.trim()) return;

    const words = input.trim().split(/\s+/);
    let totalSentenceSum = 0;
    let validWordCount = 0;

    for (let rawWord of words) {
        const cleanWord = rawWord.replace(/[\u0591-\u05C7]/g, "");
        let totalSum = 0;
        let equations = [];

        for (let char of cleanWord) {
            if (letterData[char]) {
                const data = letterData[char];
                equations.push(`${data.name} (${data.val})`);
                totalSum += data.val;
            }
        }

        if (totalSum > 0) {
            totalSentenceSum += totalSum;
            validWordCount++;
            
            let translation = 'Scanning...';
            let phonetics = '';

            // Check local macro-cache first
            if (translationCache[cleanWord]) {
                translation = translationCache[cleanWord].eng;
                phonetics = translationCache[cleanWord].phn;
            } else {
                // Async fallback to the open Wiktionary database
                try {
                    const response = await fetch(`https://api.freedictionaryapi.dev/api/v2/entries/he/${encodeURIComponent(cleanWord)}`);
                    if (response.ok) {
                        const data = await response.json();
                        // Pull out first definition match
                        translation = data[0].meanings[0].definitions[0].definition || 'Unknown node';
                        phonetics = data[0].phonetic || '';
                    } else {
                        translation = 'External Node';
                    }
                } catch (err) {
                    translation = 'Offline Mode';
                }
            }

            const wordBlock = document.createElement('div');
            wordBlock.className = 'word-block';
            wordBlock.innerHTML = `
                <div class="word-meta-row">
                    <span class="word-translation">[ ${translation} ]</span>
                    <div class="word-text-group">
                        <span class="word-title">${rawWord}</span>
                        ${phonetics ? `<span class="word-phonetic">${phonetics}</span>` : ''}
                    </div>
                </div>
                <div class="word-math">${equations.join(' + ')}</div>
                <div class="word-total">= ${totalSum}</div>
            `;
            outputDiv.appendChild(wordBlock);
        }
    }

    if (validWordCount > 1) {
        summaryDiv.style.display = 'block';
        summaryDiv.innerHTML = `MATRIX OVERALL SUMM: ${totalSentenceSum}`;
    }
}
</script>
