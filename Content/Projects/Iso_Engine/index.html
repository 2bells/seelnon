<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Isometric Game Engine & Editor</title>
    <!-- Include core styles -->
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="game/editor/editor_ui_manager.css">
    <link rel="stylesheet" href="game/ui/inventory_ui.css">
    <link rel="stylesheet" href="game/ui/dialogue.css">
    <link rel="stylesheet" href="game/world/aram.css">
    
    <style>
        /* Standalone App Reset and Core Layout Shell */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #3B322C;
            color: #EFEBE0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 14px;
        }

        #rpg-app-container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        #rpg-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #4a3c30;
            border-bottom: 2px solid #2C241D;
            padding: 8px 16px;
            box-sizing: border-box;
            height: 48px;
            flex-shrink: 0;
            user-select: none;
        }

        #rpg-title {
            font-size: 1.1em;
            font-weight: bold;
            color: #EFEBE0;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        #rpg-header-controls {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        #rpg-header-controls button {
            background-color: #8C6D56;
            color: #FFFFFF;
            border: 1px solid #5A4B3E;
            padding: 4px 12px;
            font-size: 0.9em;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
            transition: background-color 0.15s ease;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }

        #rpg-header-controls button:hover {
            background-color: #A07D65;
        }

        #rpg-header-controls button:active {
            background-color: #785C4A;
        }

        #rpg-canvas-container {
            flex-grow: 1;
            position: relative;
            background-color: #2C241D;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #rpg-canvas {
            width: 100%;
            height: 100%;
            display: block;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            image-rendering: -moz-crisp-edges;
            background-color: #D4C8A0;
        }
    </style>
</head>
<body>
    <div id="rpg-app-container">
        <!-- Persistent stand-alone editor & game control bar -->
        <div id="rpg-header">
            <h1 id="rpg-title">📁 Isometric RPG Engine & Editor</h1>
            <div id="rpg-header-controls">
                <button id="rpg-editor-button" title="Toggle Map Editor">🛠️</button>
                <button id="rpg-npc-creator-button" title="Toggle NPC Creator">👤</button>
                <button id="rpg-light-editor-button" title="Toggle Light Editor">💡</button>
                <button id="rpg-quest-editor-button" title="Toggle Quest Editor">📜</button>
                <button id="rpg-abilities-editor-button" title="Toggle Abilities Creator">⚔️</button>
                <button id="rpg-projectile-creator-button" title="Toggle Projectile Creator">☄️</button>
                <button id="rpg-item-editor-button" title="Toggle Item Creator">💎</button>
                <button id="rpg-event-editor-button" title="Toggle Event Creator">⚡</button>
                <button id="rpg-bank-editor-button" title="Toggle Global Item Bank Vault">🏦</button>
            </div>
        </div>

        <!-- Dynamic responsive canvas view -->
        <div id="rpg-canvas-container">
            <canvas id="rpg-canvas"></canvas>
            
            <!-- Zoom controls -->
            <div id="rpg-zoom-controls">
                <button id="rpg-zoom-in" title="Zoom In">+</button>
                <button id="rpg-zoom-out" title="Zoom Out">-</button>
            </div>
        </div>
    </div>

    <!-- Bootstrap Stand-alone Isometric Engine -->
    <script type="module">
        import { initStandaloneGame } from './game/main.js';
        initStandaloneGame();
    </script>
</body>
</html>
